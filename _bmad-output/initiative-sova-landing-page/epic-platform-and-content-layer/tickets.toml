# Epic breakdown: Platform and content layer. Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Scaffold, CI and Vercel staging tracer"
description = "Stands up Next.js 16 + React 19 + TypeScript strict on Node 24/npm with the TECH_STACK scripts (dev, build, start, lint, typecheck, format, test, test:e2e), Vitest, Playwright with a shared network guard that fails on requests to erasvietnam/WordPress/tracking domains except a recorded allowlist for the Google Maps embed (initiative decision 2026-10-03), shared with 2 and the page epics, GitHub Actions CI, and the Vercel project, and proves every layer connects by rendering SiteSettings.companyName on `/` through a one-method contract, mock adapter and query (`getSiteSettings`) that 3 extends."
verify = "On a fresh clone with no `.env`, all npm scripts pass and CI is green; the Vercel staging URL shows \"Sova\" read from mock SiteSettings, and the Playwright smoke test passes with the network guard active."
covers = ["CAP-1", "CAP-3"]
after = []
hitl = true
risk = "medium"
unknown = "Exact patched Next.js 16 / React 19 versions are pinned at scaffold time; the person creates and links the Vercel project and connects the GitHub repo."

[[entry]]
id = 2
type = "story"
title = "Source baseline capture, compare harness and anomaly register"
description = "Adds a Playwright script that serves `../eras-clone` read-only (no build.py), blocks and logs live requests with the network guard from 1, and captures desktop and mobile screenshots with DOM/network evidence for each route family VI/EN plus the MIGRATION_PLAN exceptions at the QA viewports 390/549/550/768/849/850/1280/1440 into git-ignored `baseline/` with a committed manifest; ships a compare helper that screenshots a Sova route at the same viewport and animation state and writes a pixel diff against its baseline, the harness every page epic uses for its routes; records and commits the `../eras-clone` SHA-256 manifest that 11 reuses; and writes the anomaly register `docs/ANOMALY_REGISTER.md` with A01–A13, owner epic and status, which 11 appends to."
verify = "Running the script recreates `baseline/` from the committed manifest with no live request leaving the machine, the `../eras-clone` SHA-256 manifest is unchanged, the compare helper reports a near-zero diff when pointed at the source itself and a visible diff on a deliberately altered page, and the register lists A01–A13 each with owner and status."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "medium"
unknown = "How to freeze GSAP and CSS animations for stable shots; the source hash method comes from docs/evidence/verify-docs.py and audit-source.py."

[[entry]]
id = 3
type = "story"
title = "Content contracts, repository, queries and scenarios"
description = "Extends the one-method contract and adapter from 1: writes every DATA_MODEL type (incl. SourceRef, AssetRef, RichContent, RouteEntry, SubmitResult with `mode` as a type only, SiteSettings extended with wordmark logo and Messenger/Zalo), extends the DATA_MODEL ContentRepository with the methods it lacks (SiteSettings, pages, pricing, partners, stats, routes) as a full async interface with a mock adapter over empty typed data files, the `lib/queries` layer, and `src/dev/scenarios.ts` (happy-path, empty, missing-media, error) selected only through dev/test config over test-only fixtures; importers in 4–9 fill the data files it creates, and epic 2 owns the SubmitAdapter and mock transport."
verify = "Vitest shows each query returns its scenario's result for happy-path, empty, missing-media and error, scenario fixtures live only under test/dev paths, and `npm run typecheck` passes with the full contract."
covers = ["CAP-3"]
after = [1]
hitl = false
risk = "medium"
unknown = "getProject/listProjects take no locale in DATA_MODEL; the builder confirms VI-only project details against ROUTE_MAP before fixing the signature."

[[entry]]
id = 4
type = "story"
title = "Import pipeline, brand term map, contact scrub, FAQ import"
description = "Builds the committed, deterministic `scripts/import/` pipeline that reads `../eras-clone` HTML and `docs/evidence/*.json` read-only and writes typed records into `src/data`; adds the brand term map in `src/lib/content/` (decode escapes, case-sensitive word-boundary match, SourceRef kept, erasvietnam links made relative or removed with a log) plus a scrub list of Eras contact values replaced by reference tokens, with the token resolver in `lib/queries` that reads SiteSettings (9 fills the values); imports VI and EN FAQs and FAQ topics with dedupe by normalized question, A05 as a revision and A13 noted; and adds the build-output grep for `Eras|eras-|erasvietnam` and the scrubbed contact values against a recorded exception list as an npm script run in CI."
verify = "Running the importer twice gives a byte-identical `src/data`; Vitest checks term-map, scrub-token cases and FAQ counts (65 VI global items in 7 topics, EN as parsed, plus service FAQs); the grep script passes on `next build` output and fails when an un-excepted `Eras` or Eras phone is planted."
covers = ["CAP-3", "CAP-12"]
after = [3]
hitl = false
risk = "high"
unknown = "How cleanly FAQ HTML parses across pages; faq-occurrences.json (308 occurrences) is the starting point."

