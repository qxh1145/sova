# Initiative breakdown: epics in build order.

[[epic]]
id = 1
slug = "epic-platform-and-content-layer"
title = "Platform and content layer"
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-12"]

[[epic]]
id = 2
slug = "epic-site-shell-and-primitives"
title = "Site shell and UI primitives"
covers = ["CAP-5", "CAP-10"]
after = [{ epic = 1, needs = "content layer, SiteSettings, navigation data, route registry, CSS tokens" }]

[[epic]]
id = 3
slug = "epic-home"
title = "Home vertical slice"
covers = ["CAP-6"]
after = [{ epic = 1, needs = "queries and mock data" }, { epic = 2, needs = "shell, primitives, carousel adapter" }]

[[epic]]
id = 4
slug = "epic-collections"
title = "Projects and blog collections"
covers = ["CAP-4", "CAP-7", "CAP-8"]
after = [{ epic = 2, needs = "Pagination, Carousel adapter" }, { epic = 3, needs = "ProjectCard, PostCard" }]

[[epic]]
id = 5
slug = "epic-services-and-about"
title = "Service pages and About"
covers = ["CAP-9", "CAP-10"]
after = [{ epic = 2, needs = "primitives, FAQ list, FormField/SubmitAdapter, carousel" }, { epic = 3, needs = "Testimonials, Partners, ProjectCard" }]

[[epic]]
id = 6
slug = "epic-utility-pages"
title = "FAQ, contact, legal and utility pages"
covers = ["CAP-10", "CAP-11"]
after = [{ epic = 2, needs = "Tabs, FAQ list, FormField/SubmitAdapter" }]

[[epic]]
id = 7
slug = "epic-fidelity-and-handoff"
title = "Fidelity sweep and phase B handoff"
covers = ["CAP-13", "CAP-14"]
after = [{ epic = 3, needs = "Home" }, { epic = 4, needs = "collection routes" }, { epic = 5, needs = "service and About routes" }, { epic = 6, needs = "utility routes" }]
